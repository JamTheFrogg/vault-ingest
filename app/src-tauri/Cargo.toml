[package]
name = "vault-ingest"
version = "0.1.0"
description = "Desktop app for vault-ingest"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vault_ingest_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-global-shortcut = "2"
cpal = "=0.18.2"
hound = "=3.5.1"

# PulseAudio through cpal's pure-Rust client: no system library needed, and PipeWire answers it too
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", features = ["pulseaudio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com"] }
